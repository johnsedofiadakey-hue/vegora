    value: AIzaSyCicY3zLGVy8t7d2Bd4O81d2oK6wcueclM
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vegoragh.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vegoragh
    availability:
      - BUILD
      - RUNTIME
