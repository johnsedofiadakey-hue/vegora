# Public Firebase web configuration for the VEGORA App Hosting preview.
# Live Paystack mode. Checkout opens only when all three switches (checkout, expiry job, webhook) are "true".
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCicY3zLGVy8t7d2Bd4O81d2oK6wcueclM
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vegoragh.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vegoragh
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:152798677943:web:9bb9f57bd57320de973632"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: vegoragh
  - variable: FIREBASE_STORAGE_BUCKET
    value: vegoragh.firebasestorage.app
  # Meta (Facebook) Pixel for the shop pages. Public by design: it appears in every page.
  - variable: NEXT_PUBLIC_META_PIXEL_ID
    value: "1455653123378759"
    availability:
      - BUILD
      - RUNTIME
  - variable: VEGORA_SITE_URL
    value: https://www.shopvegora.com
    availability:
      - RUNTIME
  - variable: VEGORA_CRON_SECRET
    secret: VEGORA_CRON_SECRET
    availability:
      - RUNTIME
  - variable: PAYSTACK_SECRET_KEY
    secret: PAYSTACK_SECRET_KEY
    availability:
      - RUNTIME
  - variable: VEGORA_PAYSTACK_MODE
    value: live
    availability:
      - RUNTIME
  - variable: VEGORA_DELIVERY_ZONES_JSON
    value: '[{"id":"accra","label":"Accra","region":"Greater Accra","feeMinor":3000},{"id":"tema","label":"Tema","region":"Greater Accra","feeMinor":5000}]'
    availability:
      - RUNTIME
  - variable: VEGORA_EXPIRY_JOB_CONFIRMED
    value: "true"
    availability:
      - RUNTIME
  - variable: VEGORA_CHECKOUT_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: VEGORA_WEBHOOK_CONFIRMED
    value: "true"
    availability:
      - RUNTIME
